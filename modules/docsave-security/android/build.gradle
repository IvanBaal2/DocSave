plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.docsavesecurity'
version = '1.1.0'

android {
  namespace "expo.modules.docsavesecurity"
  defaultConfig {
    versionCode 2
    versionName "1.1.0"
  }
}

dependencies {
  // Bundled on-device text recognition model: works offline and without
  // Google Play Services (e.g. Huawei devices). No data leaves the device.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
